name = "gromov"
defaultTargets = ["Gromov"]

# Mirrors `mathlibLeanOptions` in mathlib's own lakefile: these files were developed inside
# mathlib and elaborate differently without them.
[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "a6180e1994004a7c705114bcbebaf5fff4b8384d"

[[lean_lib]]
name = "Gromov"
