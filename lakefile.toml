name = "gromov"
defaultTargets = ["Gromov"]

# Mirrors `mathlibLeanOptions` in mathlib's own lakefile: these files were developed inside
# mathlib and elaborate differently without them (`maxSynthPendingDepth` in particular).
[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "c07d30b9c8f8fbb23fa6b01ee064d7dcc37d1d6f"

[[lean_lib]]
name = "Gromov"
